backend:
  name: git-gateway
  branch: main
  repo: AnARCHIS12/Manifeste-pour-la-Libert-Num-rique

site_url: https://manifeste-pour-la-libert-num-rique.netlify.app

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "articles"
    label: "Articles"
    folder: "_articles"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - {label: "Titre", name: "title", widget: "string"}
      - {label: "Date", name: "date", widget: "datetime"}
      - {label: "Contenu", name: "body", widget: "markdown"}
